<div class="container mt-4">
  <!-- ENCABEZADO -->
  <div class="card shadow-sm border-0 rounded-3 mb-3">
    <div class="card-header d-flex justify-content-between align-items-center text-white py-3" style="background-color: #007bff;">
      <h5 class="mb-0">
        <i class="bi bi-journal-text me-2"></i>
        Listado de Especializaciones
      </h5>
    </div>


    <!-- TABLA -->
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover align-middle text-center">
          <thead class="table-light">
            <tr>
              <th style="width: 60px;">#</th>
              <th>Nombre</th>
              <th>Descripción</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngIf="especializaciones.length === 0">
              <td colspan="3" class="text-muted py-3">
                No hay especializaciones registradas
              </td>
            </tr>

            <tr *ngFor="let esp of especializaciones; let i = index">
              <td>{{ i + 1 }}</td>
              <td class="fw-semibold">{{ esp.nombre }}</td>
              <td>{{ esp.descripcion }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
